<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Road to Pro | 12 Week Training</title><style>
:root{color-scheme:dark;--bg:#101215;--panel:#1b1e23;--ink:#f5f2e9;--muted:#a9adb5;--gold:#e4b85f;--line:#383c44}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px 16px 70px}header{padding:20px 0 12px}h1{font-size:clamp(27px,5vw,44px);line-height:1.1;margin:8px 0}h2{font-size:24px}h3{font-size:18px;margin:0 0 8px}small,.muted{color:var(--muted)}.eyebrow{color:var(--gold);font-weight:800;letter-spacing:.14em;font-size:12px}nav{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2}button,select,input,textarea{font:inherit;color:var(--ink);background:#252930;border:1px solid var(--line);border-radius:8px;padding:10px}button{cursor:pointer;font-weight:650}button.active,button.primary{background:var(--gold);color:#181510;border-color:var(--gold)}button:focus,input:focus,textarea:focus,select:focus{outline:2px solid var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:100px}.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:8px}.set{background:#14171b;border-radius:8px;padding:8px}.set label{display:block;font-size:12px;color:var(--muted)}.set input{width:100%;margin:3px 0;padding:7px}textarea{width:100%;min-height:65px;resize:vertical}input[type=checkbox]{accent-color:var(--gold);width:19px;height:19px}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--gold)}a{color:var(--gold)}.tag{color:var(--gold);font-size:13px;font-weight:700}.bar{height:9px;background:#343840;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:var(--gold)}.big{font-size:38px;color:var(--gold);font-weight:800}.hide{display:none}label{display:block;margin:4px 0}.scroll{overflow-x:auto}.exercise-title{display:flex;justify-content:space-between;gap:8px;align-items:start}details{margin:10px 0}summary{cursor:pointer;font-weight:700;color:var(--gold)}@media print{nav,.no-print,button{display:none}body{background:white;color:black}.panel,.set{background:white;color:black;border-color:#ccc}input,textarea{color:black;background:white}}</style></head><body><main><header><div class="eyebrow">CLASSIC PHYSIQUE / SPECIALIZATION</div><h1>Road to Pro</h1><div class="muted">12 weeks · 5 training days · 2 rest days · Chest / shoulders / back</div></header><nav id="nav"></nav><div id="screen"></div><footer class="muted">Logs are saved in this browser when local storage is available. Export a backup regularly. No account or internet required for the app.</footer></main><script>
const days=[
{n:'Monday · Push',focus:'Chest thickness, shoulders and triceps',e:[['Incline Smith machine press',4,'6–10','SS'],['Flat dumbbell bench press',3,'8–12','SS'],['Pec deck fly',3,'12–15','ISO'],['Seated machine shoulder press',3,'8–12','SS'],['Single-arm cable lateral raise',3,'12–20','DS'],['Machine lateral raise',2,'15–20','ISO'],['Overhead cable triceps extension',3,'10–15','NEG'],['Rope triceps pushdown',3,'12–15','SS']],notes:'Incline 15–30°; comfortable stretch; no bouncing or shortened reps; chest before shoulders; avoid shrugging lateral raises.'},
{n:'Tuesday · Pull',focus:'Back thickness, lats, rear delts and biceps',e:[['Chest-supported T-bar row',4,'6–10','SS'],['Close-grip seated cable row',3,'8–12','ISO'],['Neutral-grip lat pulldown',3,'10–12','SS'],['Single-arm machine lat row',2,'10–15','NEG'],['Reverse pec deck',3,'15–20','ISO'],['Incline dumbbell curl',3,'10–12','NEG'],['Preacher machine curl',3,'10–15','DS']],notes:'T-bar elbows 45–60° from torso; lat rows drive elbow toward hip; controlled scapular movement; use straps if grip limits back work.'},
{n:'Wednesday · Legs',focus:'Quadriceps thickness and sweep',e:[['Hack squat',4,'6–10','SS'],['45-degree leg press',3,'10–15','SS'],['Leg extension',3,'12–15','DS'],['Seated hamstring curl',3,'10–15','NEG'],['Hip adductor machine',2,'12–20','ISO'],['Standing calf raise',4,'10–15','ISO'],['Cable abdominal crunch',3,'12–20','SS']],notes:'Deepest controlled pain-free range; consistent foot position; no bouncing; hold calf stretch two seconds.'},
{n:'Thursday · Rest',focus:'Recovery before chest specialization',e:[],notes:'20–30 min low-intensity walking/cycling; 5 min thoracic/shoulder mobility; 5 min hip/lower mobility; 10–15 min posing; 8–9 hours sleep; no lifting.'},
{n:'Friday · Upper',focus:'Chest specialization, shoulder width and back density',e:[['Incline dumbbell press',3,'8–12','SS'],['Converging machine chest press',3,'10–12','SS'],['Low-to-high cable fly',2,'12–15','DS'],['Chest-supported wide-grip row',2,'8–12','ISO'],['Medium-grip lat pulldown',2,'10–15','SS'],['Single-arm cable lateral raise',3,'12–20','NEG'],['Reverse cable fly',2,'15–20','SUPER A'],['Dumbbell lateral raise',2,'15–20','SUPER B']],notes:'Chest first; consistent press technique; comfortable fly stretch; superset last two movements; no additional front-delt work.'},
{n:'Saturday · Lower',focus:'Posterior-chain thickness and calves',e:[['Seated hamstring curl',4,'8–12','NEG'],['Lying hamstring curl',3,'12–15','DS'],['Machine hip thrust',3,'8–12','ISO'],['Single-leg press',2,'10–15','SS'],['Hip abductor machine',3,'15–20','SS'],['Seated calf raise',4,'12–20','ISO'],['Reverse abdominal crunch',3,'12–20','SS']],notes:'Use supported movements and pain-free range. Given prior neck/back surgeries, avoid heavy unsupported rows, conventional deadlifts and heavy barbell squats unless cleared by your clinician.'},
{n:'Sunday · Rest',focus:'Full recovery',e:[],notes:'Light walking, optional mobility, posing, meal preparation and adequate sleep. No strenuous resistance training.'}];
const phases=[['Baseline','3 RIR'],['Accumulation','2 RIR'],['Progressive overload','1–2 RIR'],['High stimulus','1 RIR'],['Overload','1 RIR; selected isolation failure'],['Deload','4–5 RIR; half sets'],['Rebuild','2–3 RIR'],['Accumulation','2 RIR'],['Progressive overload','1–2 RIR'],['Specialization','1 RIR'],['Peak stimulus','0–1 RIR selected isolations'],['Deload / assessment','4–5 RIR; half sets']];
let db={logs:{},custom:{},week:1,day:0},storage=true;try{let saved=localStorage.getItem('road-to-pro-v1');if(saved)db={...db,...JSON.parse(saved)}}catch(e){storage=false}let tab='Workout';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('road-to-pro-v1',JSON.stringify(db));storage=true}catch(e){storage=false}if($('status'))$('status').textContent=storage?'Saved locally':'Storage unavailable — export backup before closing'}function put(k,v){db.logs[k]=v;save()}function field(k,placeholder,type='text'){return `<input type="${type}" ${type==='number'?'min="0" step="any"':''} placeholder="${placeholder}" value="${esc(db.logs[k])}" onchange="put('${k}',this.value)" aria-label="${placeholder}">`}function area(k,p){return `<textarea placeholder="${p}" onchange="put('${k}',this.value)">${esc(db.logs[k])}</textarea>`}function actual(d,i){return db.custom[d+'-'+i]||days[d].e[i]}function count(n,w){return w===6||w===12?Math.max(1,Math.round(n/2)):w<=2?Math.max(1,Math.round(n*.8)):n}function choose(t){tab=t;render()}function render(){ $('nav').innerHTML=['Workout','Nutrition','Progress','Calculator','Training notes','Settings'].map(t=>`<button class="${tab===t?'active':''}" onclick="choose('${t}')">${t}</button>`).join('');$('screen').innerHTML=tab==='Workout'?workout():tab==='Nutrition'?nutrition():tab==='Progress'?progress():tab==='Calculator'?calculator():tab==='Training notes'?notes():settings();if(tab==='Calculator')calc();if(tab==='Nutrition')nrefresh();save()}
function techniqueInfo(code){return ({SS:'Straight sets — controlled 2–3 second lowering; use the prescribed RIR.',DS:'Drop set — after the final working set, reduce weight 20–30% and immediately perform 6–12 additional controlled reps.',ISO:'Isometric hold — on each rep of the final set, hold the target position for 2–3 seconds (contraction for flys, rows and raises; stretch for calves).',NEG:'Slow negative — lower the weight for 4–5 seconds on each rep of the final working set.','SUPER A':'Superset A — immediately follow the final set with Superset B; rest 90–120 seconds after both.','SUPER B':'Superset B — perform immediately after the final set of Superset A; rest 90–120 seconds afterward.'})[code]||code}
function techniquePanel(code,w){let off=w<=2||w===6||w===12;return `<div style="border:1px solid #b69a55;border-radius:10px;padding:12px;margin:12px 0"><strong style="color:#d8b86a">Prescribed technique: ${esc(code)}</strong><p>${esc(techniqueInfo(code))}</p><p><strong>This week:</strong> ${off&&code!=='SS'?'Straight sets only — advanced technique resumes in the full-volume weeks.':code==='SS'?'All working sets.':'Apply on the final working set only.'}</p></div>`}
function workout(){let w=db.week,d=db.day,day=days[d],k=`${w}-${d}`,phase=phases[w-1];return `<div class="panel"><div class="row"><label>Week<select style="width:100%" onchange="db.week=+this.value;render()">${phases.map((p,i)=>`<option value="${i+1}" ${w===i+1?'selected':''}>${i+1} · ${p[0]}</option>`).join('')}</select></label><label>Day<select style="width:100%" onchange="db.day=+this.value;render()">${days.map((a,i)=>`<option value="${i}" ${i===d?'selected':''}>${a.n}</option>`).join('')}</select></label></div><p class="tag">${phase[0]} · ${phase[1]}</p><h2>${day.n}</h2><p>${day.focus}</p><p class="muted">${day.notes}</p><label>Session date ${field(k+'-date','Date','date')}</label><p class="muted">${w<=2?'Reduced sets (~80% rounded per exercise); no advanced techniques.':w===6||w===12?'Deload: approximately half sets, no advanced techniques.':'Full programmed sets; techniques on final set only.'}</p></div>${day.e.map((_,i)=>{let e=actual(d,i),n=count(+e[1],w),p=k+'-'+i;return `<section class="panel"><div class="exercise-title"><h3>${i+1}. ${esc(e[0])}</h3><span class="tag">${n} × ${esc(e[2])} · ${esc(e[3])}</span></div>${techniquePanel(e[3],w)}<div class="sets">${Array.from({length:n},(_,j)=>`<div class="set"><strong>Set ${j+1}</strong><label>Weight ${field(p+'-'+j+'-wt','lb / kg','number')}</label><label>Reps ${field(p+'-'+j+'-rep','Reps','number')}</label><label>RIR ${field(p+'-'+j+'-rir','RIR','number')}</label></div>`).join('')}</div><label>Exercise notes / drop-set weight & reps</label>${area(p+'-notes','Technique, load, adjustments…')}<button onclick="toCalc(${i})">Use in calculator</button></section>`}).join('')}<section class="panel"><h3>Session notes</h3>${area(k+'-notes','Recovery, soreness, posing, sleep, performance…')}<label><input type="checkbox" ${db.logs[k+'-done']?'checked':''} onchange="put('${k}-done',this.checked)"> Mark day complete</label><div class="row"><button onclick="move(-1)">Previous day</button><button class="primary" onclick="move(1)">Next day</button></div><p id="status" class="muted"></p></section>`}
function move(n){let i=(db.week-1)*7+db.day+n;i=Math.max(0,Math.min(83,i));db.week=Math.floor(i/7)+1;db.day=i%7;render()}
function progress(){return `<h2>12-week progress</h2><div class="panel"><div class="big">${Array.from({length:12},(_,i)=>days.filter((d,j)=>d.e.length&&db.logs[`${i+1}-${j}-done`]).length).reduce((a,b)=>a+b,0)} / 60</div><div class="muted">Training sessions completed</div></div>${phases.map((p,i)=>{let w=i+1,n=days.filter((d,j)=>d.e.length&&db.logs[`${w}-${j}-done`]).length;return `<div class="panel"><h3>Week ${w} · ${p[0]}</h3><div class="bar"><div style="width:${n*20}%"></div></div><p>${n}/5 sessions · ${p[1]}</p><div class="row"><label>Average body weight ${field('wk'+w+'weight','lb / kg','number')}</label><label>Chest circumference ${field('wk'+w+'chest','in / cm','number')}</label><label>Waist circumference ${field('wk'+w+'waist','in / cm','number')}</label></div><label>Weekly assessment</label>${area('wk'+w+'notes','Performance, photos taken, recovery, physique changes…')}<button onclick="db.week=${w};db.day=0;choose('Workout')">Open week</button></div>`}).join('')}`}
let cv={weight:185,target:10,reps:[10,10,9,8],inc:5,quality:true};function toCalc(i){let e=actual(db.day,i),p=`${db.week}-${db.day}-${i}`,n=count(+e[1],db.week);cv={weight:db.logs[p+'-0-wt']||0,target:Number(e[2].split(/[–-]/).pop())||10,reps:Array.from({length:n},(_,j)=>db.logs[p+'-'+j+'-rep']||''),inc:5,quality:false};choose('Calculator')}
function calculator(){return `<h2>Double progression calculator</h2><div class="panel"><p>Increase load only when all working sets reach the upper rep target with consistent technique and prescribed RIR.</p><div class="row"><label>Current weight<input id="cw" type="number" min="0" step="any" value="${cv.weight}" oninput="calc()"></label><label>Upper rep target<input id="ct" type="number" min="1" value="${cv.target}" oninput="calc()"></label><label>Weight increment<input id="ci" type="number" min="0" step="any" value="${cv.inc}" oninput="calc()"></label><label>Number of sets<select onchange="readCalc();cv.reps=Array.from({length:+this.value},(_,i)=>cv.reps[i]??'');render()">${[1,2,3,4,5,6].map(n=>`<option ${n===cv.reps.length?'selected':''}>${n}</option>`).join('')}</select></label></div><div class="sets">${cv.reps.map((r,i)=>`<label>Set ${i+1} reps<input id="cr${i}" type="number" min="0" value="${esc(r)}" oninput="calc()" style="width:100%"></label>`).join('')}</div><label><input id="cq" type="checkbox" ${cv.quality?'checked':''} onchange="calc()"> All sets used proper form and prescribed RIR</label><div id="result" aria-live="polite"></div></div><div class="panel"><h3>Example: incline Smith press, 4 × 6–10</h3><table><tr><th>Week</th><th>Weight</th><th>Reps</th></tr>${[[1,185,'9 / 8 / 7 / 7'],[2,185,'10 / 9 / 8 / 7'],[3,185,'10 / 10 / 9 / 8'],[4,185,'10 / 10 / 10 / 10'],[5,190,'8 / 8 / 7 / 7']].map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table><p>Additional reps at the same weight, range of motion and effort count as progress.</p></div>`}function readCalc(){cv.weight=$('cw').value;cv.target=$('ct').value;cv.inc=$('ci').value;cv.quality=$('cq').checked;cv.reps=cv.reps.map((_,i)=>$('cr'+i).value)}function calc(){readCalc();let valid=[cv.weight,cv.target,cv.inc,...cv.reps].every(v=>v!==''&&Number.isFinite(+v)&&+v>=0)&&+cv.target>0&&+cv.inc>0;let ready=valid&&cv.quality&&cv.reps.every(r=>+r>=+cv.target);$('result').innerHTML=valid?`<div class="big">${+(+cv.weight+(ready?+cv.inc:0)).toFixed(3)}</div><p>${ready?'Increase weight and rebuild reps.':'Maintain weight and work toward the target.'} Use the same units throughout.</p>`:'<p>Enter valid values for all sets, target and increment.</p>'}
function notes(){return `<h2>Training reference</h2><div class="panel"><h3>Weekly structure & volume</h3><table><tr><th>Day</th><th>Focus</th><th>Sets</th></tr>${days.map(d=>`<tr><td>${d.n}</td><td>${d.focus}</td><td>${d.e.reduce((a,e)=>a+e[1],0)}</td></tr>`).join('')}</table><p>Full original prescription: 108 working sets. Chest 18, back 16 (11 horizontal rows), shoulders 18 (10 lateral, 5 rear, 3 press), quads 12, hamstrings 10, calves 8, biceps 6, triceps 6, abdominals 6, targeted hip thrust/abduction 6, adduction 2. Compound exercises also train other muscles indirectly. Counts describe the original plan, not custom edits.</p><p>Chest twice weekly with four days between Monday and Friday. Maintain balanced legs, shoulder-to-waist ratio and posing. Muscle density is a visual bodybuilding description; actual hypertrophy drives thickness.</p></div><div class="panel"><h3>Scientific training principles</h3><table>${[['Heavy compound','6–10 reps'],['Secondary compound','8–12 reps'],['Isolation','10–20 reps'],['Lateral/rear delts','12–25 reps'],['Sets per exercise','2–4 generally'],['Compound rest','2–3 min'],['Isolation rest','60–120 sec'],['Standard eccentric','2–3 sec'],['Intensity','0–3 RIR in growth weeks']].map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td></tr>`).join('')}</table><p>Higher weekly set volume generally supports hypertrophy with diminishing returns. Multiple loads and rep ranges can grow muscle. Frequency helps distribute volume; twice weekly is not inherently superior when volume is equal. Longer rests help preserve performance. Advanced methods are optional, not proven universally superior to straight sets. Train close to failure, but reserve actual failure for selected safe isolations.</p></div><div class="panel"><h3>Technique glossary</h3><p><b>SS:</b> Straight sets, controlled full pain-free range.</p><p><b>DS:</b> On final set reduce load 20–30%, then perform 6–12 controlled reps. Primarily isolation exercises.</p><p><b>ISO:</b> Hold designated position for 2–3 seconds, e.g. peak contraction in flys, rows and rear delts; calf stretch as specified.</p><p><b>NEG:</b> Lower for 4–5 seconds on each rep of the final set. Do not use on every exercise.</p><p><b>SUPER:</b> A followed immediately by B, then rest 90–120 seconds. Friday final pair: both rounds paired.</p><p><b>RIR:</b> 3 = three more clean reps possible; 2 = two; 1 = one; 0 = no additional clean reps. Compounds generally 1–2 RIR; selected machine/isolation sets may reach 0.</p></div><div class="panel"><h3>12-week periodization</h3><table><tr><th>Week</th><th>Phase</th><th>Effort</th></tr>${phases.map((p,i)=>`<tr><td>${i+1}</td><td>${p[0]}</td><td>${p[1]}</td></tr>`).join('')}</table><p>Weeks 1–2: aim for 75–85% of full volume; app rounds each exercise to nearest whole set (minimum one), so actual percentage varies. Weeks 6 and 12: half sets, rounded. Skip advanced techniques in these weeks. Only advance if recovery and performance support it. Reduce volume if persistent soreness, declining performance or joint discomfort.</p></div><div class="panel"><h3>Warm-up</h3><table><tr><th>Set</th><th>% working weight</th><th>Reps</th></tr><tr><td>1</td><td>40%</td><td>12–15</td></tr><tr><td>2</td><td>60%</td><td>8–10</td></tr><tr><td>3</td><td>75%</td><td>4–6</td></tr><tr><td>4 optional</td><td>90%</td><td>1–3</td></tr></table><p>Warm-ups should not create fatigue. Subsequent exercises for the same muscle may require only 1–2 warm-up sets.</p></div><div class="panel"><h3>Recovery & nutrition</h3><table>${[['Calorie surplus','Initially 200–300 kcal/day'],['Protein','1.6–2.2 g/kg/day'],['Carbohydrates','3–5 g/kg/day'],['Fat','0.6–1.0 g/kg/day'],['Sleep','8–9 hours'],['Cardio','20–30 min, 2–3 times/week'],['Posing','10–15 min, 3–5 times/week'],['Weight gain','0.1–0.25% body weight/week']].map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td></tr>`).join('')}</table><p>Track weekly average weight, performance and progress photos. Adjust macros to calorie target. Medical clearance is assumed; modify movements that aggravate prior injuries.</p></div><div class="panel"><h3>Research references from original program</h3><p>Links require internet access. These references were carried forward from the original plan, not independently reverified during app creation.</p>${[['ACSM position stand (2026)','https://pubmed.ncbi.nlm.nih.gov/41843416/'],['Pelland et al. (2025): volume/frequency','https://pubmed.ncbi.nlm.nih.gov/41343037/'],['Currier et al. (2023): resistance training prescriptions','https://bjsm.bmj.com/content/57/18/1211'],['Robinson et al. (2024): proximity to failure','https://pubmed.ncbi.nlm.nih.gov/38970765/'],['Singer et al. (2024): rest intervals','https://pubmed.ncbi.nlm.nih.gov/39205815/'],['Drop set meta-analysis (2023)','https://pubmed.ncbi.nlm.nih.gov/37523092/'],['Advanced training systems (2026)','https://pubmed.ncbi.nlm.nih.gov/41718208/'],['Muscle length and exercise selection (2026)','https://pubmed.ncbi.nlm.nih.gov/41777276/'],['Morton et al. (2018): protein','https://bjsm.bmj.com/content/52/6/376']].map(a=>`<p><a href="${a[1]}" target="_blank" rel="noopener">${a[0]}</a></p>`).join('')}</div>`}
function settings(){return `<h2>Customize & back up</h2><div class="panel"><h3>Data management</h3><p>Export your logs and exercise changes to a JSON file. Import that file to restore on another browser. Browser storage may be cleared, and local-file previews may not support it.</p><div class="row"><button class="primary" onclick="backup()">Export backup</button><button onclick="$('importer').click()">Import backup</button><button onclick="window.print()">Print current view</button></div><input id="importer" type="file" accept=".json,application/json" class="hide" onchange="restore(this)"><p id="status" class="muted"></p></div><div class="panel"><h3>Edit exercise prescription</h3><p>Changes apply to all weeks; existing set logs remain stored by exercise position. Changing an exercise name does not erase its prior logs. Keep a backup before editing.</p>${days.map((d,j)=>d.e.length?`<details><summary>${d.n}</summary>${d.e.map((_,i)=>{let e=actual(j,i);return `<div class="panel"><label>Exercise<input style="width:100%" value="${esc(e[0])}" onchange="edit(${j},${i},0,this.value)"></label><div class="row"><label>Sets<input type="number" min="1" max="6" value="${e[1]}" onchange="edit(${j},${i},1,this.value)"></label><label>Reps<input value="${esc(e[2])}" onchange="edit(${j},${i},2,this.value)"></label><label>Technique<input value="${esc(e[3])}" onchange="edit(${j},${i},3,this.value)"></label></div></div>`}).join('')}</details>`:'').join('')}<button onclick="if(confirm('Restore original prescriptions? Logs will remain.')){db.custom={};render()}">Restore original exercises</button></div>`}function edit(d,i,k,v){let e=[...actual(d,i)];e[k]=k===1?Math.min(6,Math.max(1,Math.round(+v)||1)):v;db.custom[d+'-'+i]=e;save()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='road-to-pro-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!x.logs||typeof x.logs!=='object'||!x.custom||typeof x.custom!=='object'||!Number.isInteger(x.week)||x.week<1||x.week>12||!Number.isInteger(x.day)||x.day<0||x.day>6)throw Error();if(confirm('Replace current logs and edits with this backup?')){db=x;render()}}catch(e){alert('Invalid backup file.')}el.value=''}const foods=[['Egg whites',10.9,.7,.2,'raw'],['Whole egg',12.6,.7,9.5,'raw, without shell'],['Oats',13.2,67.7,6.5,'dry'],['Blueberries',.7,14.5,.3,'raw'],['Peanut butter',25,20,50,'as sold'],['Cream of rice',6,80,.5,'dry'],['Whey isolate',85,4,2,'dry; check label'],['Banana',1.1,22.8,.3,'peeled'],['Chicken breast',31,0,3.6,'cooked'],['White rice',2.7,28.2,.3,'cooked'],['Broccoli',2.4,7.2,.4,'cooked'],['Avocado',2,8.5,14.7,'edible flesh'],['97/3 ground turkey',29,0,5,'cooked; approximate'],['96/4 ground beef',29,0,6,'cooked; approximate'],['Sweet potato',2,20.7,.2,'cooked'],['Salmon',22,0,12,'cooked'],['Almonds',21,22,50,'as sold']];
const mealNames=['9:00 AM — Breakfast','10:15 AM — Pre-workout','12:30 PM — Post-workout','5:00 PM — Meal 4','10:00 PM — Final meal'];
const baseMeals=[[[0,140],[1,100],[2,50],[3,100],[4,16]],[[5,70],[6,30],[7,100]],[[8,100],[9,230],[10,100],[13,50]],[[12,100],[9,140],[11,90],[10,100],[13,50]],[[15,130],[9,70],[16,20],[14,220],[10,100]]];
function nstate(){if(!db.nutrition||db.nutrition.profileVersion!==3){let old=db.nutrition;if(old)db.previousNutrition=old;db.nutrition={profileVersion:3,mode:old?.mode||'Training',plans:Object.fromEntries(Object.entries(old?.plans||{}).filter(([k,v])=>Array.isArray(v)&&v.length===6).map(([k,v])=>{let p=JSON.parse(JSON.stringify(v));let extra=p.splice(4,1)[0];for(let r of extra){if(r[0]===13){p[2].push([r[0],r[1]/2]);p[3].push([r[0],r[1]/2]);}else p[4].push(r);}return [k,p];})),targets:old?.targets||{Training:[217,336.5,79],Rest:[212.3,282.66,78.485]},checks:old?.checks||{}};save();}return db.nutrition}
function nplan(mode){let n=nstate();if(!n.plans[mode]){n.plans[mode]=JSON.parse(JSON.stringify(baseMeals));if(mode==='Rest'){n.plans[mode][1][0][1]=45;n.plans[mode][2][1][1]=150;n.plans[mode][3][1][1]=100;}}return n.plans[mode]}
function ntot(rows){return rows.reduce((a,r)=>{let f=foods[r[0]];return a.map((v,i)=>v+f[i+1]*r[1]/100)},[0,0,0])}
function nk(a){return a[0]*4+a[1]*4+a[2]*9}function nm(a){return `${Math.round(nk(a))} kcal · P ${a[0].toFixed(1)} g · C ${a[1].toFixed(1)} g · F ${a[2].toFixed(1)} g`}
function nchange(m,i,key,value){let p=nplan(nstate().mode);p[m][i][key]=key===0?Number(value):Math.max(0,Number(value)||0);save();nrefresh()}
function nrefresh(){let p=nplan(nstate().mode);p.forEach((rows,m)=>{rows.forEach((r,i)=>{let e=$(`nf-${m}-${i}`);if(e)e.textContent=nm(ntot([r]));let w=$(`nw-${m}-${i}`);if(w)w.textContent=foods[r[0]][4]});let e=$('nm-'+m);if(e)e.textContent=nm(ntot(rows))});$('ndaily').textContent=nm(ntot(p.flat()));$('ntarget').textContent=nm(nstate().targets[nstate().mode]);let a=ntot(p.flat()),b=nstate().targets[nstate().mode];$('ndiff').textContent='Actual minus target: '+Math.round(nk(a)-nk(b))+' kcal; '+a.map((v,i)=>['P','C','F'][i]+' '+(v-b[i]).toFixed(1)+' g').join(' · ');if($('ngrocery'))$('ngrocery').innerHTML=ngrocery()}
function ngrocery(){let totals=foods.map(()=>0);['Training','Rest'].forEach((mode,i)=>nplan(mode).flat().forEach(r=>totals[r[0]]+=r[1]*(i===0?5:2)));return totals.map((v,i)=>v?`<tr><td>${foods[i][0]}<br><small>${foods[i][4]}</small></td><td>${Math.round(v)} g</td></tr>`:'').join('')}
function nutrition(){let n=nstate(),p=nplan(n.mode);return `<h2>Nutrition / lean growth</h2><div class="panel"><p>Personalized starting plan: age 28, 200 lb, 5 ft 9 in, estimated 15% body fat, 3,000 steps/day, no current cardio. Estimated maintenance 2,600–2,900 kcal; calibrate over 14 days. Training ~2,925 kcal; rest ~2,686 kcal. Previous nutrition settings are retained in exported backup under previousNutrition; workout logs are unchanged. Food values are estimates; use package labels where available. Calories use 4/4/9 macro estimates.</p><div class="row">${['Training','Rest'].map(s=>`<button class="${n.mode===s?'active':''}" onclick="nstate().mode='${s}';render()">${s} day</button>`).join('')}</div><h3 style="margin-top:16px">Daily macro calculator</h3><div id="ndaily" class="tag"></div><p>Target: <span id="ntarget"></span></p><div class="row">${['Protein','Carbs','Fat'].map((s,i)=>`<label>${s} (g)<input style="width:100%" type="number" min="0" value="${n.targets[n.mode][i]}" onchange="nstate().targets[nstate().mode][${i}]=Math.max(0,+this.value||0);save();nrefresh()"></label>`).join('')}</div><p id="ndiff" class="muted"></p></div>${p.map((rows,m)=>`<div class="panel"><h3>${mealNames[m]}${n.mode==='Rest'&&(m===1||m===2)?' (regular meal)':''}</h3>${rows.map((r,i)=>`<div class="set" style="margin:8px 0"><div class="row"><label>Food<select style="width:100%" onchange="nchange(${m},${i},0,this.value)">${foods.map((f,j)=>`<option value="${j}" ${j===r[0]?'selected':''}>${f[0]}</option>`).join('')}</select></label><label>Grams<input type="number" min="0" step="any" value="${r[1]}" onchange="nchange(${m},${i},1,this.value)"></label></div><small id="nw-${m}-${i}"></small><div id="nf-${m}-${i}" class="tag"></div><button onclick="nplan(nstate().mode)[${m}].splice(${i},1);render()">Remove</button></div>`).join('')}<button onclick="nplan(nstate().mode)[${m}].push([0,100]);render()">Add food</button><p id="nm-${m}" class="tag"></p></div>`).join('')}<div class="panel"><h3>Weekly groceries — 5 training / 2 rest days</h3><p>Weights reflect the listed preparation state, not necessarily raw purchase weights. Buy extra for cooking losses.</p><table><tbody id="ngrocery"></tbody></table></div><div class="panel"><h3>12-week nutrition check-ins</h3><p>Track seven-day average morning weight and waist at the same location. Aim for 0.2–0.5 lb weight gain weekly; reassess after two weeks. If weight is flat and performance stalls, add 100–150 kcal/day; if weight and waist rise too quickly, reduce similarly. Do not automatically cut calories on deload weeks.</p>${Array.from({length:12},(_,i)=>`<details><summary>Week ${i+1}${i===5||i===11?' — deload':''}</summary><div class="row"><label>Avg weight (lb)${field('nutrition-weight-'+i,'Weight','number')}</label><label>Waist (in)${field('nutrition-waist-'+i,'Waist','number')}</label></div>${area('nutrition-note-'+i,'Appetite, digestion, performance, adjustments')}</details>`).join('')}</div><div class="panel"><h3>Meal preparation & recovery</h3><p>Batch cook lean meats, rice and vegetables; refrigerate promptly and use within 3–4 days or freeze. Weigh cream of rice and oats dry, meats and rice cooked. Breakfast at 9 AM, lighter pre-workout at 10:15 AM, train 11 AM–noon. If breakfast feels heavy, move peanut butter to meal 5. Five meals daily; the former evening meal is redistributed across meals 3–5. Rest days use the same times without workout timing requirements. No beets, cauliflower, rice cakes or olive oil. Gradually increase steps toward 5,000–6,000 daily and optionally add two 20-minute easy cardio sessions; keep activity consistent while assessing calories. Current sleep is 6 hours (3 AM–9 AM); aim to move bedtime earlier toward 1 AM or earlier for at least 8 hours. Drink to thirst and replace sweat losses; aim for 8–9 hours sleep. Include varied produce.</p><h3>Optional supplements</h3><p>Creatine monohydrate 3–5 g/day; whey isolate as needed to meet protein goals. Caffeine is optional if tolerated; avoid near bedtime. Check medication interactions and use third-party tested products.</p><h3>Food swaps</h3><p>Use the food dropdown and adjust grams to match meal macros. Cream of rice replaces rice cakes; avocado, peanut butter and almonds replace added olive oil.</p><button onclick="if(confirm('Reset this day meal plan?')){delete nstate().plans[nstate().mode];render()}">Reset selected meal plan</button></div>`}

render();</script></body></html>
